---
- name: Restart nginx
  ansible.builtin.include_tasks: nginx_restart.yaml
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
- name: Restart sshd
  ansible.builtin.service:
    name: sshd
    state: restarted
- name: Restart systemd-journald
  ansible.builtin.service:
    name: systemd-journald
    state: restarted
# auditd refuse `systemctl restart` (RefuseManualStop) : passer par service.
- name: Restart auditd
  ansible.builtin.command: service auditd restart # noqa: command-instead-of-module
  changed_when: true
