---
- name: Set application openfisca variables
  ansible.builtin.set_fact:
    repository_folder: /home/{{ server_user_name }}/{{ item.name }}/repository
    venv_dir: /home/{{ server_user_name }}/{{ item.name }}/venv
    openfisca_service_name: "{{ item.name }}_openfisca"
- name: Openfisca setup and update
  block:
    # Le venv est lié à son interpréteur par un lien symbolique. Après une
    # montée de version de Debian, il pointe sur le nouveau Python système et
    # ne voit plus ses paquets : pip lui-même devient introuvable. On le recrée.
    - name: Read the virtual env Python version of {{ item.name }}
      ansible.builtin.command:
        argv:
          - "{{ venv_dir }}/bin/python"
          - -c
          - import sys; print('%d.%d' % sys.version_info[:2])
      register: venv_python
      changed_when: false
      failed_when: false
    - name: Remove a virtual env built on another Python
      ansible.builtin.file:
        path: "{{ venv_dir }}"
        state: absent
      when: venv_python.stdout != python_control_version
    # Python {{ python_control_version }} et non le Python système : les
    # dépendances d'OpenFisca (numpy < 2, pandas < 2) ne s'installent pas sur le
    # Python 3.13 de Debian 13. install_python.yaml fournit cette version.
    - name: Create Python virtual env and upgrade pip
      become: true
      become_user: "{{ server_user_name }}"
      ansible.builtin.pip:
        name: pip
        virtualenv: "{{ venv_dir }}"
        virtualenv_command: python{{ python_control_version }} -m venv
        extra_args: --upgrade
    - name: Install Openfisca requirements
      become: true
      become_method: ansible.builtin.sudo
      ansible.builtin.pip:
        requirements: "{{ repository_folder }}/openfisca/requirements.txt"
        virtualenv: "{{ venv_dir }}"
        virtualenv_command: python{{ python_control_version }} -m venv
        extra_args: --upgrade
    - name: Setup openfisca service
      ansible.builtin.template:
        src: templates/openfisca.service.j2
        dest: /etc/systemd/system/{{ openfisca_service_name }}.service
        mode: "0644"
      register: openfisca_unit
      notify: Reload systemd
    # Le `Environment=` de l'unité n'entre dans le processus qu'à l'exec :
    # gunicorn relit bien sa configuration sur SIGHUP, mais `config.py` lit
    # l'environnement figé. Seul un redémarrage propage OPENFISCA_WORKERS.
    # Un handler ne convient pas : il est différé en fin de play et dédupliqué,
    # alors que `openfisca_service_name` vaut une valeur différente par
    # application. Seule la dernière serait redémarrée.
    - name: Apply the new unit definition of {{ openfisca_service_name }} # noqa: no-handler
      become: true
      become_method: ansible.builtin.sudo
      when: openfisca_unit is changed
      ansible.builtin.systemd:
        name: "{{ openfisca_service_name }}"
        daemon_reload: true
        state: restarted
        enabled: true
    - name: Reload or start {{ openfisca_service_name }}
      become: true
      become_method: ansible.builtin.sudo
      when: openfisca_unit is not changed
      changed_when: false
      ansible.builtin.service:
        name: "{{ openfisca_service_name }}"
        state: reloaded
        enabled: true
